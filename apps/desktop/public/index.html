<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾传 · PickDrop</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <div class="app">
    <header class="titlebar" title="拖动窗口，靠近屏幕左、右或顶部边缘后松手贴合">
      <button id="group-menu-button" class="group-title" aria-label="群菜单" aria-expanded="false"><span class="group-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><g transform="translate(256 256) scale(1) translate(-256 -256)"><g transform="translate(22 36)"><path fill="#126A5A" d="M133 264 C109 247 96 233 72 233 C42 233 28 253 32 278 C45 357 128 407 228 409 C354 412 427 350 436 240 C440 195 427 167 403 165 C374 163 350 184 329 211 C294 257 254 282 211 283 C179 284 158 280 133 264 Z"/><rect x="176" y="53" width="145" height="145" rx="30" fill="#32C6A2" transform="rotate(-24 248.5 125.5)"/></g></g></svg></span><strong id="group-name">拾传</strong><span class="chevron">⌄</span></button>
      <span class="window-grip" aria-hidden="true">⠿</span>
      <div class="window-actions"><button id="pin-button" title="固定展开" aria-label="固定展开" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 3 8 0-1 7 3 3v2H6v-2l3-3zM12 15v6"/></svg></button><button id="dock-button" title="贴到屏幕边缘" aria-label="贴边" aria-pressed="false"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M15 5v14"/></svg></button><button id="close-button" title="关闭窗口" aria-label="关闭窗口">×</button></div>
    </header>
    <button class="device-strip" id="members-button"><span id="member-avatars" class="member-avatars" aria-hidden="true"></span><span id="device-summary">连接中…</span><span class="connection-state"><span id="connection-dot" class="connection-dot offline"></span><span id="connection-status">连接中</span></span><span class="members-chevron" aria-hidden="true">›</span></button>
    <div id="group-menu" class="group-menu" hidden><div class="menu-label">已加入的群 · 点选打开独立窗口</div><div id="group-list"></div><div class="menu-divider"></div><button id="create-group">＋ 新建群</button><button id="join-group">＃ 输入邀请码</button><div class="menu-divider"></div><button id="invite-members">邀请设备加入</button><button id="view-members">本群成员与设备</button><button id="network-settings">网络连接设置</button></div>
    <button id="network-offline" class="network-offline" hidden>所选网络已断开 · 选择网络</button>
    <section id="join-request-banner" class="join-request-banner" aria-label="待处理的加入申请" hidden>
      <div class="join-request-heading"><span class="join-request-icon" aria-hidden="true">＋</span><strong id="join-request-summary" role="status" aria-live="polite"></strong></div>
      <div class="join-request-controls"><button id="view-join-requests" type="button">查看详情</button><button id="deny-join-request" type="button" data-action="deny-join">拒绝</button><button id="approve-join-request" type="button" data-action="approve-join">允许加入</button></div>
    </section>
    <main id="timeline" class="timeline" aria-label="当前群聊天记录" aria-live="polite"></main>
    <div id="uploads" class="uploads" aria-live="polite"></div>
    <section id="image-drafts" class="image-drafts" aria-label="待发送图片" hidden><div id="image-draft-summary" class="image-draft-summary" role="status"></div><div id="image-draft-list" class="image-draft-list"></div></section>
    <form class="composer" id="composer"><button type="button" id="choose-file" title="发送文件" aria-label="发送文件">＋</button><input id="message-input" autocomplete="off" aria-label="消息内容" placeholder="发文件或说点什么…"><button type="submit" id="send-text" title="发送消息" aria-label="发送消息"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 15 8-15 8 3-8-3-8Z"/><path d="M8 12h12"/></svg></button></form>
    <div class="custom-window-resize-handle" aria-label="调整窗口大小" title="拖动调整窗口大小"></div>
  </div>
  <div id="drop-overlay" class="drop-overlay" hidden><div><span>↓</span><strong id="drop-label">松开，发到当前群</strong><small>文件与消息只在本群共享</small></div></div>
  <dialog id="panel"><header class="panel-heading"><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭弹窗">×</button></header><div id="panel-body"></div></dialog>
  <div id="toast" role="status" hidden></div><input type="file" id="file-input" multiple hidden>
  <script type="module" src="/app.js"></script>
</body></html>
