name: Android APK
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      PICKDROP_ANDROID_PREVIEW: '1'
      NODE_ENV: production
      # This job builds React Native only; Electron's desktop binary is unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies including build tools
        run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm mobile:check
      - run: pnpm test
        env:
          # React's act helper is available only in the test/development build.
          NODE_ENV: test
      - name: Generate Android native project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install --clean
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          # Main builds seed the shared cache. PRs and tags only restore it.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install required Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build standalone release APK with preview signing
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
      - name: Verify APK and package release files
        run: |
          mkdir -p release-assets
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          APK="release-assets/PickDrop-$VERSION-Android-arm64-preview.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > release-assets/ANDROID-BUILD.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" >> release-assets/ANDROID-BUILD.txt
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          grep "package: name='app.pickdrop.mobile.preview'" release-assets/ANDROID-BUILD.txt
          if grep -q 'application-debuggable' release-assets/ANDROID-BUILD.txt; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-android
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostic log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: ignore
