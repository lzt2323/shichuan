name: PickDrop Unified Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_KIND: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const root = JSON.parse(readFileSync('package.json'));
          const mobile = JSON.parse(readFileSync('apps/mobile/package.json'));
          const expo = JSON.parse(readFileSync('apps/mobile/app.json')).expo;
          const tui = JSON.parse(readFileSync('apps/tui/package.json'));
          if ((process.env.RELEASE_KIND === 'tag' && process.env.RELEASE_TAG !== `v${root.version}`) || mobile.version !== root.version || expo.version !== root.version || tui.version !== root.version) throw new Error('Tag and package versions must match');
          if (!existsSync(`docs/releases/v${root.version}.md`)) throw new Error('Release notes are missing');
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm mobile:check
      - run: pnpm mobile:export
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            command: pnpm desktop:package
            artifact: dist/PickDrop-*-Mac-AppleSilicon.zip
          - os: windows-latest
            target: windows
            command: pnpm desktop:package:windows
            artifact: dist/PickDrop-*-Windows.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged Mac application
        if: matrix.target == 'mac'
        env:
          PICKDROP_TEST_EXECUTABLE: ${{ github.workspace }}/dist/mac-arm64/PickDrop.app/Contents/MacOS/PickDrop
        run: pnpm desktop:peer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  android:
    needs: verify
    uses: ./.github/workflows/android.yml
  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Package standalone Linux terminal client
        run: pnpm linux:package --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-linux-${{ matrix.arch }}
          path: dist/PickDrop-*-Linux-${{ matrix.arch }}-TUI.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete platform set and generate checksums
        run: node scripts/release-manifest.js release-assets
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('Refusing to overwrite an already published release')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "拾传 $RELEASE_TAG · 全平台内测版" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
